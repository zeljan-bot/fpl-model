name: fetch-fpl-data
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch.py
      - name: Commit
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%M)"
          git push
